name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite regression tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
      OPENAI_API_KEY: mock_key
      ALLOW_OFFLINE_MODE: "true"
      API_ACCESS_TOKEN: test-token-for-ci-only-0123456789abcdef
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate frontend JavaScript syntax
        run: node --check frontend/script.js
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: test-password-for-compose-validation
          API_ACCESS_TOKEN: test-token-for-ci-only-0123456789abcdef
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Run tests
        run: pytest -q
      - name: Run offline evaluation smoke suite
        run: python scripts/run_evals.py

  postgres:
    name: PostgreSQL checkpoint and API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: operations_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operations_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/operations_agent
      OPENAI_API_KEY: mock_key
      ALLOW_OFFLINE_MODE: "true"
      API_ACCESS_TOKEN: test-token-for-ci-only-0123456789abcdef
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Run tests against PostgreSQL
        run: pytest -q
      - name: Run offline evaluation smoke suite against PostgreSQL
        run: python scripts/run_evals.py
