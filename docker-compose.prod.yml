services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-operations_agent}
    # The database is reachable only on the internal Docker network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-operations_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-operations_agent}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-AIOpsAgent}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      ALLOW_OFFLINE_MODE: ${ALLOW_OFFLINE_MODE:-false}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?API_ACCESS_TOKEN must be set to a random token of at least 32 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-ui-domain.example}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: ["python", "-m", "app.main"]
    networks:
      - internal_network

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      BACKEND_URL: http://web:8080
      BACKEND_API_TOKEN: ${API_ACCESS_TOKEN:?API_ACCESS_TOKEN must be set to a random token of at least 32 characters}
    command: >
      streamlit run streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.enableCORS false
      --server.enableXsrfProtection true
      --browser.gatherUsageStats false
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  pgdata:
